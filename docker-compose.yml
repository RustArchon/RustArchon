networks:
  rustarchon-net:

volumes:
  postgres-data:
  dataprotection-keys:
  dataprotection-keys-session:
  rabbitmq-data:
  garage-meta:
  garage-data:

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rustarchon
      # Same reasoning as rabbitmq below - POSTGRES_PASSWORD is the exact name this image requires, so
      # .env just uses that name directly.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host-loopback only (never 0.0.0.0) - lets the .NET projects run/debug natively in Visual
      # Studio against this container instead of also running in Docker themselves. See README.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rustarchon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustarchon"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    # RabbitMQ derives its node identity (rabbit@<hostname>) from the container hostname, which Docker
    # otherwise randomizes on every recreation - without pinning this, a recreated container boots as
    # a brand-new, empty node sitting right next to its own old data on the rabbitmq-data volume below,
    # rather than finding it. Confirmed by hand: without this line, `docker compose up -d
    # --force-recreate rabbitmq` silently loses every durable queue and message even with the volume
    # mounted - the volume alone is not sufficient. See README.
    hostname: rabbitmq
    environment:
      # No RustArchon-specific rename here - RABBITMQ_DEFAULT_USER/PASS are the exact names this image
      # requires, so .env just uses those names directly instead of inventing parallel ones to map.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      # Both host-loopback only (never 0.0.0.0). 5672 (AMQP) is what lets the .NET projects run/debug
      # natively in Visual Studio against this container - see README. 15672 is the management UI.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      # Durable queues/exchanges and persistent messages (e.g. EmailRequested) live on disk under
      # /var/lib/rabbitmq (RabbitMQ's Mnesia database) - without this volume, recreating this
      # container (docker compose down, an image bump, anything short of a plain restart) silently
      # wipes every durable queue and every message still sitting in it. See README.
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rustarchon-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs RustArchon.Api's platform-settings cache (see PlatformSettingsCache) - never a durable
  # source of truth on its own, Postgres (the PlatformSetting table) always is. No volume: losing this
  # container's data on recreation just means every setting is re-read from Postgres on the next
  # request, exactly like a cold cache after a restart. RustArchon.Panel also reads directly from this
  # same container (see SiteBrandingService/ValkeyCache) - not a separate cache of its own.
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      # Host-loopback only, same reasoning as postgres/rabbitmq above.
      - "127.0.0.1:6379:6379"
    networks:
      - rustarchon-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Garage (S3-compatible object storage, https://garagehq.deuxfleurs.fr) -------------------------
  # Backs the theming feature's uploaded package assets (CSS/images/fonts) - a theme package is a small
  # file tree, not a single value, so it doesn't fit Postgres/Valkey the way every other piece of
  # platform config does. Picked over MinIO: MinIO's open-source repo was archived in February 2026
  # (no longer maintained, no security patches) after stripping admin features out of the free edition
  # in 2025. Garage is AGPL-3.0 (same family as this project) and built by a nonprofit collective
  # (Deuxfleurs) rather than a company with an enterprise tier to protect.
  #
  # Single-node/replication_factor=1 here, same as every other backing store in this stack - see
  # garage.toml's own remarks on the metadata-durability caveat that configuration carries, and why
  # that's a property of this deployment (one Proxmox cluster) rather than something a different tool
  # would avoid.
  #
  # Requires a one-time manual bootstrap after first `up` - assigning this node a cluster layout, then
  # creating a bucket and an access key - before it will durably accept reads/writes. See README/
  # DEPLOYMENT.md; nothing here automates that safely, the same way RUSTARCHON_ADMIN_CODE's bootstrap
  # and the ghcr.io login in DEPLOYMENT.md are also one-time manual steps.
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      # Read by Garage in preference to the (absent) rpc_secret/admin_token keys in garage.toml - see
      # that file's own remarks. Generate both with `openssl rand -hex 32`.
      #
      # Deliberately `:-` (a soft empty default), not `:?` (Compose's hard-required marker), unlike
      # RUSTARCHON_JWT_SECRET_KEY/RUSTARCHON_INTERNAL_API_KEY below. Compose validates every `:?`
      # variable across the *entire* file before running any command at all, for any service - so a
      # `:?` here would fail `docker compose exec postgres ...` or `docker compose ps`, not just an
      # attempt to actually start `garage`. Theming is optional (the rest of this stack runs fine
      # without it - see S3ObjectStorage's own remarks on lazily constructing its client for exactly
      # this reason); the compose file itself has to stay usable for everything else regardless of
      # whether anyone has ever bootstrapped Garage. Leaving these blank just means `garage` itself
      # won't come up healthy if you do start it - a normal, contained failure of one optional service,
      # not a reason the whole file should refuse to parse.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      # Host-loopback only, same reasoning as postgres/rabbitmq/valkey above - lets RustArchon.Api run
      # natively in Visual Studio against this container instead of also running in Docker itself.
      # 3901 (RPC) is deliberately not published - nothing outside this container ever needs to reach
      # it, not even the `garage` CLI bootstrap below (that runs inside the container via `docker
      # compose exec`, in the same network namespace).
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    networks:
      - rustarchon-net
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Never publishes a port to the host - reachable only from rustarchon-panel/rustarchon-worker on
  # rustarchon-net. This, not just the InternalApiKey header check, is what actually keeps
  # /internal/... unreachable from outside Docker. See README.
  rustarchon-api:
    build:
      context: .
      dockerfile: RustArchon.Api/Dockerfile
    restart: unless-stopped
    environment:
      # Defaults to Production - override in .env (e.g. ASPNETCORE_ENVIRONMENT=Development) only for
      # local compose-based testing, never for a real deployment (Development leaks full exception
      # details and skips UseHsts/UseExceptionHandler - see each project's Program.cs).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=RustArchon;Username=rustarchon;Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__Host: rabbitmq
      Valkey__ConnectionString: "valkey:6379"
      RUSTARCHON_JWT_SECRET_KEY: ${RUSTARCHON_JWT_SECRET_KEY:?RUSTARCHON_JWT_SECRET_KEY must be set in .env}
      # Must be the exact public URL a browser loads RustArchon.Panel from - the CORS check compares
      # this against the browser's Origin header, not against wherever this container itself is
      # reachable from. Defaults to the plain-port local URL; set PANEL_PUBLIC_URL in .env once Panel
      # is fronted by a real hostname (e.g. a Cloudflare Tunnel) - see README/DEPLOYMENT.md.
      CorsSettings__BlazorServerUrl: ${PANEL_PUBLIC_URL:-http://localhost:8080}
      DataProtection__KeyPath: /keys
      # These six are passed straight through with no rename - RustArchon.Api reads each of these
      # exact names directly (see Program.cs), not a Section__Key-mapped equivalent. The RABBITMQ_
      # pair additionally matches the rabbitmq service's own required names above, not a
      # RustArchon-specific one - see RabbitMqOptions's remarks.
      RUSTARCHON_INTERNAL_API_KEY: ${RUSTARCHON_INTERNAL_API_KEY:?RUSTARCHON_INTERNAL_API_KEY must be set in .env}
      # Only ever consulted once, the very first time the API seeds the PlatformSetting table (see
      # PlatformSettingsRegistry) - a fresh deployment's initial "require invitation codes?" value.
      # Changing it after that first startup does nothing; use the platform-settings admin page
      # instead. See ADR note in PlatformSettingsRegistry.cs.
      RUSTARCHON_INVITATION_CODES_ENABLED: ${RUSTARCHON_INVITATION_CODES_ENABLED:-true}
      RUSTARCHON_ADMIN_EMAIL: ${RUSTARCHON_ADMIN_EMAIL:-}
      RUSTARCHON_ADMIN_CODE: ${RUSTARCHON_ADMIN_CODE:-}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      # Theming feature's object storage (see the garage service below and IObjectStorage's remarks).
      # Deliberately no `:?required` guard, unlike the secrets above - nothing at Api startup actually
      # calls Garage (IObjectStorage has no connection check at construction), so a deployment that
      # hasn't set these up yet still starts fine; only an actual theme upload/fetch would fail until
      # they're set. Container-to-container URL, same pattern as Valkey/RabbitMQ above - never a public
      # endpoint.
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT:-http://garage:3900}
      GARAGE_S3_ACCESS_KEY: ${GARAGE_S3_ACCESS_KEY:-}
      GARAGE_S3_SECRET_KEY: ${GARAGE_S3_SECRET_KEY:-}
      GARAGE_S3_BUCKET: ${GARAGE_S3_BUCKET:-rustarchon-themes}
    volumes:
      - dataprotection-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - rustarchon-net

  # Needs outbound internet/LAN access to reach arbitrary Rust servers' WebRCON endpoints, unlike
  # every other service here, which only ever talks to the others on rustarchon-net.
  rustarchon-worker:
    build:
      context: .
      dockerfile: RustArchon.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      RabbitMq__Host: rabbitmq
      Api__BaseUrl: "http://rustarchon-api:8080"
      # Passed straight through, same names RustArchon.Api and (for the internal key) the Blazor web
      # app also read - see InternalApiOptions's/RabbitMqOptions's remarks.
      RUSTARCHON_INTERNAL_API_KEY: ${RUSTARCHON_INTERNAL_API_KEY:?RUSTARCHON_INTERNAL_API_KEY must be set in .env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      # Deployment-level kill switch, independent of whatever email provider is configured on the
      # platform settings page - set to true on a test/staging deployment so it can keep a real
      # provider configured there (to exercise that UI end to end) without risking a real send. See
      # RustArchon.Worker's EmailDeliveryOptions for what this does and why it exists.
      RUSTARCHON_SUPPRESS_EMAIL_DELIVERY: ${RUSTARCHON_SUPPRESS_EMAIL_DELIVERY:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustarchon-api:
        condition: service_started
    networks:
      - rustarchon-net

  # The AGPL-licensed app itself (sign-up, servers, console, admin) - see README/NOTICE.md.
  # Publishes a port to the host, same as rustarchon-web below - fronting both behind real
  # panel./www. subdomains is a reverse-proxy step (e.g. a Cloudflare Tunnel) done outside this file;
  # see DEPLOYMENT.md.
  rustarchon-panel:
    build:
      context: .
      dockerfile: RustArchon.Panel/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=RustArchon_Identity;Username=rustarchon;Password=${POSTGRES_PASSWORD:-postgres}"
      RUSTARCHON_JWT_SECRET_KEY: ${RUSTARCHON_JWT_SECRET_KEY:?RUSTARCHON_JWT_SECRET_KEY must be set in .env}
      # Container-to-container - unlike CorsSettings__BlazorServerUrl/MarketingBaseUrl below, nothing
      # outside this compose network ever calls this URL directly, so it's never the public hostname.
      ApiBaseUrl: "http://rustarchon-api:8080"
      # Same Valkey container rustarchon-api already uses, not a separate one - SiteBrandingService
      # reads the SiteName/SiteUrl settings straight out of it (see Infrastructure/ValkeyCache.cs),
      # rather than the old MarketingBaseUrl env var this replaced, which pointed at RustArchon.Web
      # directly and had no way to reflect an admin's own change to either setting.
      Valkey__ConnectionString: "valkey:6379"
      RUSTARCHON_INTERNAL_API_KEY: ${RUSTARCHON_INTERNAL_API_KEY:?RUSTARCHON_INTERNAL_API_KEY must be set in .env}
      # Shared with rustarchon-web below - same volume, same path, same ApplicationName in code -
      # so RustArchon.Web can decrypt the cookie this issues. See both Program.cs files.
      DataProtection__SessionKeyPath: /keys-session
      # Left unset here (both services are still plain "localhost" ports locally, which already
      # share cookies across ports as the same hostname - no Domain attribute needed). A real
      # deployment sets this to .rustarchon.com via an environment override, not by editing this
      # file - see the README's cross-app session section.
      CookieDomain: ${COOKIE_DOMAIN:-}
    volumes:
      - dataprotection-keys-session:/keys-session
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rustarchon-api:
        condition: service_started
      valkey:
        condition: service_healthy
    networks:
      - rustarchon-net

  # The marketing site (home/features/pricing/contact) - a separate, non-AGPL app (see
  # RustArchon.Web/README.md) with no database and no API calls of its own; it only needs to know
  # where to point its Login/Sign Up/Get Started links, plus read-only access to the same session
  # cookie rustarchon-panel issues (see DataProtection__SessionKeyPath above and both Program.cs
  # files) so its nav can show "Dashboard" instead of "Log In"/"Sign Up" when one exists.
  rustarchon-web:
    build:
      context: .
      dockerfile: RustArchon.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # The public URL a browser reaches RustArchon.Panel at - "Log In"/"Sign Up"/"Get Started" links.
      PanelBaseUrl: ${PANEL_PUBLIC_URL:-http://localhost:8080}
      # Container-to-container, same reasoning as rustarchon-panel's own ApiBaseUrl above - this was
      # missing entirely until PlansApiClient (the pricing page) needed it; without it this falls back
      # to its own appsettings.json default (https://localhost:7130), which resolves to nothing inside
      # this container.
      ApiBaseUrl: "http://rustarchon-api:8080"
      DataProtection__SessionKeyPath: /keys-session
    volumes:
      - dataprotection-keys-session:/keys-session
    ports:
      - "8081:8080"
    networks:
      - rustarchon-net
