name: Publish container images

# Only the umbrella repo's own main branch ever triggers this - specifically because that's the one
# point where a known-good, already-tested combination of pinned submodule commits exists (see
# README's "Cloning this repo"/multi-repo workflow: every submodule PR merges into its own repo first,
# then a single "bump submodules" PR lands here last). Building from each submodule's own main the
# moment its PR merges would risk pulling in sibling versions that were never actually run together.
on:
  push:
    branches: [main]

# RustArchon.RconEmulator is a standalone repo (not a submodule of this one) with its own build, not
# this workflow's concern.
#
# rustarchon-web is included (it's built the same way as the other three) but its package is meant to
# stay PRIVATE - it's the one proprietary, non-AGPL project in this org (see
# RustArchon.Web/README.md/LICENSE), unlike api/panel/worker whose source is already public anyway.
# GHCR packages default to private the first time they're published via GITHUB_TOKEN regardless, but
# that's not something this workflow controls or verifies going forward - after the very first run,
# go set each package's visibility by hand once (org → Packages → package → Package settings →
# Change visibility): public for rustarchon-api/-panel/-worker, and leave rustarchon-web private.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: RustArchon.Api/Dockerfile
          - service: panel
            dockerfile: RustArchon.Panel/Dockerfile
          - service: worker
            dockerfile: RustArchon.Worker/Dockerfile
          - service: web
            dockerfile: RustArchon.Web/Dockerfile
    steps:
      # submodules: recursive clones all eight submodules in one shot regardless of which service is
      # being built this leg - including RustArchon.Web, which is private (see this workflow's own
      # remarks above). The default GITHUB_TOKEN only has read access to this repo (the umbrella)
      # itself, not sibling private repos, so checkout - and therefore every matrix leg, not just
      # "web" - fails outright without a real credential here. Requires a one-time repo setup step:
      # create a fine-grained PAT (Settings -> Developer settings -> Personal access tokens ->
      # Fine-grained tokens) scoped to just this org's repos with Contents: Read-only, and add it as
      # this repo's Actions secret SUBMODULES_PAT (Settings -> Secrets and variables -> Actions).
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lowercase org name hardcoded rather than derived from github.repository_owner - GHCR requires
      # an all-lowercase image path, and this org's actual name (RustArchon) isn't.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rustarchon/rustarchon-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
